name: build-ps2-elf
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project (unzip if needed)
        run: |
          for Z in $(find . -name '*.zip' -not -path './.git/*'); do unzip -q -o "$Z" -d "unpacked_$(basename "$Z" .zip)"; done
          M=$(find . -name ANGRYBIRDS_PS2.txt -not -path './.git/*' | head -n1)
          if [ -z "$M" ]; then echo "ERROR: ANGRYBIRDS_PS2.txt not found - upload angrybirds_ps2.zip to the repo root"; find . -type f -not -path './.git/*' | head -60; exit 1; fi
          dirname "$M" > root.txt
          echo "project root: $(cat root.txt)"; ls "$(cat root.txt)" "$(cat root.txt)/src" "$(cat root.txt)/data"
      - name: Build ELF in ps2dev container
        run: |
          ROOT=$(cat root.txt)
          docker run --rm -v "$PWD":/src -w "/src/$ROOT" ps2dev/ps2dev:latest sh -c 'apk add --no-cache make git build-base && make && cp ANGRYBIRDS.ELF /src/ANGRYBIRDS.ELF'
      - uses: actions/upload-artifact@v4
        with:
          name: ANGRYBIRDS.ELF
          path: ANGRYBIRDS.ELF
