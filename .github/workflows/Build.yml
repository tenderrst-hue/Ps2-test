name: Build PS2 ELF

on:
  push:
    paths:
      - "ps2port_src.part*"
      - "ps2port_src.zip"
      - "ps2port/**"
      - ".github/workflows/Build.yml"
  pull_request:
    paths:
      - "ps2port_src.part*"
      - "ps2port_src.zip"
      - "ps2port/**"
      - ".github/workflows/Build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Reassemble and verify source
        run: |
          if [ -f ps2port_src.part01 ] && [ -f ps2port_src.part02 ]; then
            cat ps2port_src.part01 ps2port_src.part02 > ps2port_src.zip
          fi
          test -s ps2port_src.zip
          unzip -tq ps2port_src.zip
          unzip -oq ps2port_src.zip -d .
          test -f ps2port/Makefile
          test -f ps2port/src/main_ps2.c
          test -f ps2port/src/game.c
          test -f ps2port/src/level.c

      - name: Run native gameplay tests
        run: |
          gcc -O2 -std=gnu99 -Wall -Wextra ps2port/src/game.c ps2port/src/host_test.c -lm -o /tmp/host_test
          /tmp/host_test

      - name: Build BALDI.ELF with PS2SDK
        run: |
          docker pull ps2dev/ps2dev:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src/ps2port \
            ps2dev/ps2dev:latest \
            bash -lc 'make clean && make'

      - name: Verify ELF
        run: test -s ps2port/BALDI.ELF

      - name: Upload BALDI.ELF
        uses: actions/upload-artifact@v4
        with:
          name: BALDI-PS2
          path: ps2port/BALDI.ELF
          if-no-files-found: error
