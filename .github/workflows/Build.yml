name: Build PS2 ELF

on:
  push:
    paths:
      - "ps2port_src.part*"
      - "ps2port_src.zip"
      - "ps2port/**"
      - ".github/workflows/Build.yml"
  pull_request:
    paths:
      - "ps2port_src.part*"
      - "ps2port_src.zip"
      - "ps2port/**"
      - ".github/workflows/Build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Reassemble and verify source
        run: |
          if [ -f ps2port_src.part01 ] && [ -f ps2port_src.part02 ]; then
            cat ps2port_src.part01 ps2port_src.part02 > ps2port_src.zip
          fi
          test -s ps2port_src.zip
          unzip -tq ps2port_src.zip
          unzip -oq ps2port_src.zip -d .
          test -f ps2port/Makefile
          test -f ps2port/src/main_ps2.c
          test -f ps2port/src/game.c
          test -f ps2port/src/level.c

      - name: Run native gameplay tests
        run: |
          gcc -O2 -std=gnu99 -Wall -Wextra ps2port/src/game.c ps2port/src/host_test.c -lm -o /tmp/host_test
          /tmp/host_test

      - name: Prepare bin2s compatibility helper
        run: |
          cat > ps2port/.ci-bin2s.c <<'EOF'
          #include <stdio.h>
          int main(int argc, char **argv) {
            FILE *in, *out; long n; int c, i = 0;
            if (argc != 4 && argc != 5) return 2;
            in = fopen(argv[1], "rb"); if (!in) return 3;
            fseek(in, 0, SEEK_END); n = ftell(in); rewind(in);
            out = fopen(argv[2], "w"); if (!out) return 4;
            fprintf(out, ".sdata\\n\\n.globl size_%s\\nsize_%s:\\t.word %ld\\n\\n", argv[3], argv[3], n);
            if (argc == 5) fprintf(out, ".SECTION %s\\n\\n", argv[4]); else fprintf(out, ".data\\n\\n");
            fprintf(out, ".balign 16\\n\\n.globl %s\\n%s:\\n", argv[3], argv[3]);
            while ((c = fgetc(in)) != EOF) {
              if ((i++ % 16) == 0) fprintf(out, "\\n\\t.byte 0x%02x", c);
              else fprintf(out, ", 0x%02x", c);
            }
            fprintf(out, "\\n"); fclose(in); fclose(out); return 0;
          }
          EOF

      - name: Build BALDI.ELF with PS2SDK
        run: |
          docker pull ps2dev/ps2dev:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src/ps2port \
            ps2dev/ps2dev:latest \
            sh -c 'apk add --no-cache make gcc musl-dev && \
              echo "PS2DEV=$PS2DEV PS2SDK=$PS2SDK" && \
              test -f "$PS2DEV/gsKit/include/gsKit.h" && \
              mkdir -p "$PS2SDK/bin" && \
              gcc .ci-bin2s.c -o "$PS2SDK/bin/bin2s" && \
              chmod +x "$PS2SDK/bin/bin2s" && \
              sed -i "/^EE_INCS +=/a EE_INCS += -I$PS2DEV/gsKit/include" Makefile && \
              sed -i "/^EE_LDFLAGS +=/a EE_LDFLAGS += -L$PS2DEV/gsKit/lib" Makefile && \
              make clean && make'

      - name: Verify ELF
        run: test -s ps2port/BALDI.ELF

      - name: Upload BALDI.ELF
        uses: actions/upload-artifact@v4
        with:
          name: BALDI-PS2
          path: ps2port/BALDI.ELF
          if-no-files-found: error
