name: build-ps2-elf
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate sources and create Makefile if missing
        run: |
          echo "=== files in repo ==="
          find . -type f -not -path './.git/*' | head -80
          SRC=$(find . -name rps.c -not -path './.git/*' | head -n1)
          if [ -z "$SRC" ]; then echo "ERROR: rps.c not found - upload the whole src folder"; exit 1; fi
          ROOT=$(dirname "$(dirname "$SRC")")
          echo "$ROOT" > root.txt
          echo "project root: $ROOT"
          if [ ! -f "$ROOT/Makefile" ]; then
            echo "Makefile missing - generating"
            printf '%s\n' 'GSKIT ?= $(PS2DEV)/gsKit' 'EE_BIN = RPS.ELF' 'EE_OBJS = src/main_ps2.o src/gfx_ps2.o src/rps.o src/shapes.o src/scene.o' 'EE_INCS += -I$(GSKIT)/include' 'EE_LDFLAGS += -L$(GSKIT)/lib' 'EE_LIBS = -lgskit -ldmakit -lpad -lkernel -lc -lm' 'EE_CFLAGS += -O2 -std=gnu99' 'all: $(EE_BIN)' 'include $(PS2SDK)/samples/Makefile.pref' 'include $(PS2SDK)/samples/Makefile.eeglobal' > "$ROOT/Makefile"
          fi
      - name: Build ELF in ps2dev container
        run: |
          ROOT=$(cat root.txt)
          docker run --rm -v "$PWD":/src -w "/src/$ROOT" ps2dev/ps2dev:latest sh -c 'apk add --no-cache make git build-base && make && cp RPS.ELF /src/RPS.ELF'
      - uses: actions/upload-artifact@v4
        with:
          name: RPS.ELF
          path: RPS.ELF
