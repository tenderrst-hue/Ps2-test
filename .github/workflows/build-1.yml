name: build-ps2-elf
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ELF in ps2dev container
        run: |
          docker run --rm -v "$PWD":/src -w /src ps2dev/ps2dev:latest sh -c 'apk add --no-cache make git build-base && D=$(dirname "$(find /src -name Makefile | head -n1)") && cd "$D" && make && cp RPS.ELF /src/RPS.ELF'
      - uses: actions/upload-artifact@v4
        with:
          name: RPS.ELF
          path: RPS.ELF
